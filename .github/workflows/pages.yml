# Mise en ligne automatique sur GitHub Pages à chaque modification de la branche main
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # On publie uniquement les fichiers de l'appli
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html style.css app.js rapports.js sw.js manifest.webmanifest icons vendor _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deploiement
        uses: actions/deploy-pages@v4

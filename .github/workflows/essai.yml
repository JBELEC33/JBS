# Essai temporaire (ne pas fusionner dans main) : recherche des sources de travaux
name: Essai services
on:
  push:
    branches: [claude/keen-bell-077ud9]
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - name: Pages TomTom (rendues dans un navigateur)
        run: |
          python3 -m pip install --quiet --user --break-system-packages playwright
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
          cat > lire.py <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b = p.chromium.launch()
            for u in ['https://docs.tomtom.com/legal/terms-and-conditions', 'https://www.tomtom.com/en_gb/thirdpartyproductterms/']:
              pg = b.new_page()
              pg.goto(u, wait_until='networkidle', timeout=90000)
              pg.wait_for_timeout(4000)
              t = re.sub(r'\s+', ' ', pg.inner_text('body'))
              print('=================', u, len(t))
              # une clause par ligne
              for morceau in re.split(r'(?= \d{1,2}\.\d{1,2}(?:\.\d{1,2})?\. )|(?= "[A-Z][^"]{2,40}" means)', t):
                print('§', morceau.strip()[:1200])
            b.close()
          PY
          python3 lire.py

# Essai temporaire (ne pas fusionner dans main) : vérifie les services utilisés par la recherche
name: Essai services
on:
  push:
    branches: [claude/keen-bell-077ud9]
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - name: BAN filtre departement
        run: |
          for u in "https://data.geopf.fr/geocodage/search?q=place+de+la+bourse&limit=3&index=address&depcode=33" "https://data.geopf.fr/geocodage/search?q=place+de+la+bou&limit=3&index=address&autocomplete=1&depcode=33" "https://data.geopf.fr/geocodage/search?q=rue+de+la+paix&limit=3&index=address&depcode=33"; do
            echo "== $u"; curl -sS -m 20 "$u" | python3 -c "import json,sys; d=json.load(sys.stdin); print([ (f['properties']['label'], f['properties'].get('depcode')) for f in d.get('features',[])] if 'features' in d else d)"; done
      - name: Overpass
        run: |
          Q='[out:json][timeout:600];area["ISO3166-2"="FR-33"]->.g;(nwr(area.g)["name"]["shop"];nwr(area.g)["name"]["amenity"];nwr(area.g)["name"]["tourism"];nwr(area.g)["name"]["office"];nwr(area.g)["name"]["leisure"];nwr(area.g)["name"]["healthcare"];nwr(area.g)["name"]["craft"];nwr(area.g)["shop"="bakery"];nwr(area.g)["amenity"="pharmacy"];);out center tags;'
          for s in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "== $s"
            if curl -sS -m 900 -A "GPS-Bordeaux/1.0 (github.com/JBELEC33/JBS)" --data-urlencode "data=$Q" "$s" -o o.json -w '%{http_code} %{time_total}s\n' && head -c 300 o.json && python3 -c "import json; json.load(open('o.json'))"; then echo OK; break; fi
          done
          ls -la o.json; gzip -k o.json; ls -la o.json.gz
          python3 -c "
          import json,collections
          d=json.load(open('o.json'))['elements']; print('elements',len(d))
          c=collections.Counter()
          for e in d:
            t=e.get('tags',{})
            for k in ('shop','amenity','tourism','office','leisure','healthcare','craft'):
              if k in t: c[k+'='+t[k]]+=1; break
          print(c.most_common(300))
          print('avec addr:city', sum(1 for e in d if 'addr:city' in e.get('tags',{})), 'avec addr:street', sum(1 for e in d if 'addr:street' in e.get('tags',{})), 'avec horaires', sum(1 for e in d if 'opening_hours' in e.get('tags',{})))
          for e in d:
            n=e.get('tags',{}).get('name','')
            if any(s in n for s in ('CPAM','Caisse primaire','CAF','Allocations','URSSAF','France Travail','Pôle','Préfecture','CHU','Pellegrin','Assurance Maladie')): print(n, {k:v for k,v in e['tags'].items() if k in ('amenity','office','operator','healthcare','government','short_name','official_name','alt_name','addr:city')})
          "

# Essai temporaire (ne pas fusionner dans main) : prépare le fichier des rues et teste le calcul
name: Essai services
on:
  push:
    branches: [claude/keen-bell-077ud9]
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/time -v python3 scripts/preparer_rues.py 2>&1 | grep -v "^\s*\(Page\|Socket\|Signals\|Swaps\|File system\|Average\|Exit\|Voluntary\|Involuntary\|Minor\|Major\|Percent\)"
      - run: ls -la donnees && gzip -k donnees/rues.bin && ls -la donnees
      - run: node scripts/tester_itineraire.js donnees/rues.bin

# Essai temporaire (sera supprimé) : captures d'écran avec la vraie carte
name: Essai
on:
  push:
    branches: [claude/keen-bell-077ud9]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p donnees resultats
          gh release download donnees -p lieux.json -p travaux.json -D donnees
          python3 -m pip install --quiet --user --break-system-packages osmium
          python3 scripts/preparer_rues.py
          node scripts/tester_itineraire.js donnees/rues.bin | head -4
          npm install --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          (python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2
          node essai_captures.js
          git config user.name essai; git config user.email essai@example.com
          git checkout -b essai-resultats
          git add -f resultats
          git commit -qm "Captures de l'essai"
          git push -f origin essai-resultats

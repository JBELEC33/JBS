# Essai temporaire (ne pas fusionner dans main) : prépare le fichier des lieux et teste la recherche
name: Essai services
on:
  push:
    branches: [claude/keen-bell-077ud9]
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/preparer_lieux.py
      - run: ls -la donnees && gzip -k donnees/lieux.json && ls -la donnees
      - run: node scripts/tester_recherche.js donnees/lieux.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: lieux
          path: donnees/lieux.json

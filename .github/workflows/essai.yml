# Essai temporaire (ne pas fusionner dans main) : consignes de guidage sur les vraies rues
name: Essai services
on:
  push:
    branches: [claude/keen-bell-077ud9]
jobs:
  essai:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: gh release download donnees -p rues.bin -D donnees
